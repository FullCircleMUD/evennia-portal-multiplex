[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-portal-multiplex"
version = "0.0.1"
description = "Runs several Evennia servers behind one portal, and redirects a player's session from one server to another."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "portal", "multiplex", "session", "amp", "multi-server"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-portal-multiplex"
Repository = "https://github.com/FullCircleMUD/evennia-portal-multiplex"
Issues = "https://github.com/FullCircleMUD/evennia-portal-multiplex/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_portal_multiplex*"]
